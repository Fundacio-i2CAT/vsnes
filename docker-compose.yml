services:
  satellite-1:
    build: .
    container_name: SATELLITE-1
    hostname: SATELLITE-1
    privileged: true
    cgroup: host
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
      - NET_RAW
    security_opt:
      - apparmor=unconfined
    depends_on:
      - ibi-es
    environment:
      - ROLE=client
      - GS_IP=${GS_IP:-172.28.0.80}
      - GS_PORTS=5201 5202 5203 5204 5205 5206
      - PING_INTERVAL=${PING_INTERVAL:-4}
      - THROUGHPUT_SEGMENT_S=${THROUGHPUT_SEGMENT_S:-900}
    volumes:
      - /lib/modules:/lib/modules:ro
      - ./results:/results
      - ./control:/control:ro
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      olsr_net:
        ipv4_address: 172.28.0.10
        mac_address: 02:42:ac:1c:02:0a
    restart: unless-stopped
